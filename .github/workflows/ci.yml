name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verification
        run: bun run verify

      - name: Enforce release prep on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bun run release:guard

  opencode-v2-runtime:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      OPENCODE_V2_IMAGE: ghcr.io/anomalyco/opencode:2.0.6@sha256:216ad0031f35d39ac7cfe4eb056af5d33c3647f4946641735c579902ecead737
      NODE_FIXTURE_IMAGE: node:24.18.0-alpine3.24@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pull immutable images before the test container is created. The
      # network-isolated container performs no dependency or package downloads.
      - name: Pull pinned runtime images
        run: |
          docker pull --platform linux/amd64 "$OPENCODE_V2_IMAGE"
          docker pull --platform linux/amd64 "$NODE_FIXTURE_IMAGE"

      - name: Build the offline fixture image
        run: |
          docker build --pull=false --platform linux/amd64 \
            --file scripts/opencode-v2-runtime.Dockerfile \
            --tag claudex-opencode-v2-runtime:ci .

      - name: Run OpenCode v2.0.6 private-store API fixture (not full TUI) offline
        run: |
          log_file="$RUNNER_TEMP/opencode-v2-runtime.log"
          set +e
          docker run --pull=never --rm --platform linux/amd64 \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 1g \
            --cpus 2 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --env CLAUDEX_OPENCODE_V2_NETWORK_ISOLATED=1 \
            claudex-opencode-v2-runtime:ci \
            node scripts/verify-opencode-v2-private-store.mjs >"$log_file" 2>&1
          status=$?
          set -e

          if grep -q -F -e 'fake-only-opencode-v2-default-store-key' \
                    -e 'fake-only-opencode-v2-alias-a-key' \
                    -e 'fake-only-opencode-v2-alias-a-refreshed-key' \
                    -e 'fake-only-opencode-v2-alias-b-key' "$log_file"; then
            echo '::error::The OpenCode V2 fixture log contains a fake credential.'
            exit 1
          fi

          cat "$log_file"
          exit "$status"
